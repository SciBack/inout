services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inout}
      POSTGRES_USER: ${POSTGRES_USER:-inout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inout}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      # Config por institución (overlay). Vacío en el canónico → agnóstico.
      - ${INSTITUTION_CONFIG_DIR:-./config}:/config:ro
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-inout}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-inout}
      FACULTY_CONFIG_PATH: ${FACULTY_CONFIG_PATH:-/config/faculty_map.json}
      SEDES_CONFIG_PATH: ${SEDES_CONFIG_PATH:-/config/sedes.json}
      DEFAULT_SEDE_CODE: ${DEFAULT_SEDE_CODE:-}
      # Proveedores de identidad (todos deshabilitados por defecto → agnóstico)
      IDENTITY_MAP_PATH: ${IDENTITY_MAP_PATH:-/config/identity_map.json}
      LABELS_CONFIG_PATH: ${LABELS_CONFIG_PATH:-/config/labels.json}
      KOHA_ENABLED: ${KOHA_ENABLED:-false}
      KOHA_PRIORITY: ${KOHA_PRIORITY:-50}
      KOHA_DB_ENABLED: ${KOHA_DB_ENABLED:-false}
      KOHA_DB_PRIORITY: ${KOHA_DB_PRIORITY:-40}
      # Atributo extendido de Koha que guarda el documento del patron. Vacío =
      # no se consulta y el patron se indexa solo por su carné.
      KOHA_DOCUMENT_ATTRIBUTE: ${KOHA_DOCUMENT_ATTRIBUTE:-}
      LDAP_ENABLED: ${LDAP_ENABLED:-false}
      LDAP_PRIORITY: ${LDAP_PRIORITY:-100}
      LDAP_HOST: ${LDAP_HOST:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASS: ${LDAP_BIND_PASS:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_BRANCHES: ${LDAP_BRANCHES:-}
      LDAP_USER_FILTER: ${LDAP_USER_FILTER:-}
      LDAP_ID_ATTRS: ${LDAP_ID_ATTRS:-}
      LDAP_PAGE_SIZE: ${LDAP_PAGE_SIZE:-500}
      CSV_ENABLED: ${CSV_ENABLED:-false}
      CSV_PRIORITY: ${CSV_PRIORITY:-200}
      CSV_PATH: ${CSV_PATH:-}
      KOHA_API_URL: ${KOHA_API_URL}
      KOHA_API_USER: ${KOHA_API_USER}
      KOHA_API_PASS: ${KOHA_API_PASS}
      KOHA_VERIFY_SSL: ${KOHA_VERIFY_SSL:-false}
      DEFAULT_SPACE_ID: ${DEFAULT_SPACE_ID:-1}
      DEFAULT_SPACE_CAPACITY: ${DEFAULT_SPACE_CAPACITY:-150}
      DEFAULT_SPACE_NAME: ${DEFAULT_SPACE_NAME:-Biblioteca}
      SECRET_KEY: ${SECRET_KEY}
      KOHA_DB_HOST: ${KOHA_DB_HOST:-}
      KOHA_DB_USER: ${KOHA_DB_USER:-}
      KOHA_DB_PASS: ${KOHA_DB_PASS:-}
      KOHA_DB_NAME: ${KOHA_DB_NAME:-}
      # Koha por sede (REST API)
      KOHA_BUL_API_URL: ${KOHA_BUL_API_URL:-}
      KOHA_BUL_API_USER: ${KOHA_BUL_API_USER:-}
      KOHA_BUL_API_PASS: ${KOHA_BUL_API_PASS:-}
      KOHA_BUT_API_URL: ${KOHA_BUT_API_URL:-}
      KOHA_BUT_API_USER: ${KOHA_BUT_API_USER:-}
      KOHA_BUT_API_PASS: ${KOHA_BUT_API_PASS:-}
      KOHA_BUJ_API_URL: ${KOHA_BUJ_API_URL:-}
      KOHA_BUJ_API_USER: ${KOHA_BUJ_API_USER:-}
      KOHA_BUJ_API_PASS: ${KOHA_BUJ_API_PASS:-}
      KOHA_CIA_API_URL: ${KOHA_CIA_API_URL:-}
      KOHA_CIA_API_USER: ${KOHA_CIA_API_USER:-}
      KOHA_CIA_API_PASS: ${KOHA_CIA_API_PASS:-}
      # Koha DB directa por sede (fotos)
      KOHA_BUT_DB_HOST: ${KOHA_BUT_DB_HOST:-}
      KOHA_BUT_DB_USER: ${KOHA_BUT_DB_USER:-}
      KOHA_BUT_DB_PASS: ${KOHA_BUT_DB_PASS:-}
      KOHA_BUT_DB_NAME: ${KOHA_BUT_DB_NAME:-}
      KOHA_BUJ_DB_HOST: ${KOHA_BUJ_DB_HOST:-}
      KOHA_BUJ_DB_USER: ${KOHA_BUJ_DB_USER:-}
      KOHA_BUJ_DB_PASS: ${KOHA_BUJ_DB_PASS:-}
      KOHA_BUJ_DB_NAME: ${KOHA_BUJ_DB_NAME:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
